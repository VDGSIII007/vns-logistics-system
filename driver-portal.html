<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNS Driver Portal</title>
  <link rel="stylesheet" href="mobile-driver.css">
</head>
<body class="driver-mobile-page driver-portal-page">
  <main class="driver-mobile-shell">
    <header class="driver-mobile-header">
      <p class="driver-mobile-kicker">VNS Logistics</p>
      <h1>VNS Driver Portal</h1>
      <p>Truck Operations</p>
    </header>

    <div id="driver-portal-status" class="driver-mobile-status" hidden></div>

    <section id="login-view" class="driver-mobile-card driver-portal-login-card">
      <form id="driver-login-form" class="driver-mobile-form" novalidate>
        <section class="driver-mobile-section">
          <p class="driver-mobile-card-label">Driver Sign-in</p>
          <h2>Welcome back</h2>
          <p class="driver-mobile-card-copy">Sign in to access your truck assignment.</p>
          <label class="driver-mobile-field">
            <span>Username</span>
            <input id="driver-username" class="driver-mobile-input" autocomplete="username" required>
          </label>
          <label class="driver-mobile-field">
            <span>Password</span>
            <input id="driver-password" class="driver-mobile-input" type="password" autocomplete="current-password" required>
          </label>
        </section>
        <button id="driver-login-button" class="driver-mobile-submit driver-mobile-primary-btn" type="submit">Login</button>
        <p class="driver-mobile-footer-note">For VNS drivers and helpers only.</p>
      </form>
    </section>

    <section id="dashboard-view" class="driver-portal-dashboard" hidden>
      <article class="driver-mobile-truck-card driver-portal-truck-card">
        <p class="driver-mobile-kicker">Assigned Truck</p>
        <h2 id="dashboard-plate">-</h2>
        <dl>
          <div><dt>Driver</dt><dd id="dashboard-driver">-</dd></div>
          <div><dt>Helper</dt><dd id="dashboard-helper">-</dd></div>
          <div><dt>Group</dt><dd id="dashboard-group">-</dd></div>
        </dl>
      </article>

      <p class="driver-portal-dashboard-prompt">Choose what you want to submit.</p>

      <div class="driver-portal-action-grid">
        <button class="driver-portal-action-card" type="button" data-action="trip">
          <span>Current Trip</span>
          <small>Submit trip details</small>
        </button>
        <button class="driver-portal-action-card" type="button" data-action="po">
          <span>PO Request</span>
          <small>Request PO approval</small>
        </button>
        <button class="driver-portal-action-card" type="button" data-action="trip_budget">
          <span>Trip Budget</span>
          <small>Request trip cash</small>
        </button>
        <button class="driver-portal-action-card" type="button" data-action="bali">
          <span>Bali</span>
          <small>Cash advance</small>
        </button>
        <button class="driver-portal-action-card" type="button" data-action="requests">
          <span>My Requests</span>
          <small>Check approval and payment status</small>
        </button>
        <button class="driver-portal-action-card" type="button" data-action="notifications">
          <span>Enable Notifications</span>
          <small>Get update alerts when connected</small>
        </button>
      </div>

      <button id="driver-logout-button" class="driver-mobile-secondary" type="button">Logout</button>
    </section>
  </main>

  <script src="driver-portal.js"></script>
</body>
</html>
