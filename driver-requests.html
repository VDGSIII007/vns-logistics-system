<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNS Driver Portal - My Requests</title>
  <link rel="stylesheet" href="mobile-driver.css">
</head>
<body class="driver-mobile-page driver-requests-page">
  <main class="driver-mobile-shell">
    <header class="driver-mobile-header">
      <p class="driver-mobile-kicker">VNS Logistics</p>
      <h1>My Requests</h1>
      <p>Approval and payment status</p>
    </header>

    <a id="driver-requests-back" class="driver-mobile-back-link" href="driver-portal.html">← Back to Driver Portal</a>

    <section class="driver-mobile-truck-card">
      <p class="driver-mobile-kicker">Plate Number</p>
      <h2 id="requests-pass-plate">-</h2>
      <dl>
        <div><dt>Driver</dt><dd id="requests-pass-driver">-</dd></div>
        <div><dt>Helper</dt><dd id="requests-pass-helper">-</dd></div>
        <div><dt>Group</dt><dd id="requests-pass-group">-</dd></div>
      </dl>
    </section>

    <div id="driver-requests-status" class="driver-mobile-status" hidden></div>

    <section class="driver-mobile-card driver-mobile-section">
      <h2>Request Status</h2>
      <div id="driver-requests-list" class="driver-request-list"></div>
    </section>
  </main>

  <script src="driver-requests.js"></script>
</body>
</html>
